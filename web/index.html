<!DOCTYPE html>
<html lang="en" >
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>sable</title>
    <style>
     @font-face {
       font-family: "FairfaxHD";
       src: url("fairfax-hd/FairfaxHD.ttf") format("truetype");
       font-weight: 400;
       font-style: normal;
     }
     :root {
       --bg: #eeeeee;
       --fg: #111111;
       --pad: #ffffff;
       --border: #cccccc;
       --accent: #2222ff;
       --accent-bright: #000088;
       --err: #ff2222;
      }
     * { box-sizing: border-box; }
     body {
       margin: 0;
       background: var(--bg);
       color: var(--fg);
       font-family: sans-serif;
     }
     main {
       max-width: 720px;
       margin: 0 auto;
       padding: 2rem;
     }
     h1 {
       margin: 0 0 .25rem;
     }
     textarea, pre, .glyphs {
       width: 100%;
       margin: 0;
       padding: 0.5rem;
       border: 1px solid var(--border);
       background: var(--pad);
       color: var(--fg);
       font-family: "FairfaxHD", monospace;
       font-size: 18px;
     }
     .pending, .pending:focus {
       border: 1px solid var(--accent-bright);
     }
     .glyphs a {
       text-decoration: none;
       color: var(--accent);
       padding: 0.1rem;
       font-size: 20px;
     }
     .glyphs a:hover {
       color: var(--pad);
       background: var(--accent);
     }
     textarea {
       min-height: 10rem;
       resize: vertical;
     }
     textarea:focus {
       outline: none;
       border: 1px solid var(--accent);
     }
     pre {
       min-height: 5rem;
       white-space: pre-wrap;
       overflow-x: auto;
     }
     pre.err {
       color: var(--err);
     }
     button {
       padding: .4rem .8rem;
       border: 1px solid var(--border);
       background: var(--accent);
       color: var(--pad);
     }
     button:hover {
       background: var(--pad);
       color: var(--accent);
     }
     .bar {
       display: flex;
       gap: .5rem;
       align-items: center;
       margin: .75rem 0;
       flex-wrap: wrap;
     }
    </style>
  </head>
  <body>
    <main>
      <h1>sable</h1>

      <div class="glyphs" id="glyphs"></div>
      <textarea id="src" spellcheck="false" autofocus></textarea>

      <div class="bar" >
        <button id="run" disabled >Run</button>
        <span id="status" >Loading</span>
      </div>

      <pre id="result" ></pre>
    </main>

    <script>
     const $ = id => document.getElementById(id);

     const MAX_INTERPRETER_STEPS = 4294967295;
     const MAX_TIME_MS = 10000;

     const source = $("src");
     const result = $("result");
     const run_button = $("run");
     const status = $("status");

     function insert(g) {
       source.setRangeText(g, source.selectionStart, source.selectionEnd, 'end');
       source.dispatchEvent(new Event('input', { bubbles: true }));
     }

     let glyphs = Array.from("∅.,~⫦⊪+-×÷*|↧↥¬=≠>≥<≤□↓↑Ρ/⊂ιρ⧻△▽ˊ¨:ˋ‿⋄←%");
     let keys   = Array.from("n   oO  +-  mM  = > <pdtS eislrR12 3_;[ ");

     const keymap = Object.fromEntries(
       keys
         .map((k,i) => k==' '?null:k=='_'?' ':k)
         .map((k,i) => [k, glyphs[i]])
         .filter(([, g]) => g && g !== ' ')
     );

     const prefix = '\\';
     let pending = false;
     source.addEventListener("keydown", ev => {
       if (pending) {
         pending = false;
         source.classList.remove("pending");
         if (ev.key === "Escape") {
           ev.preventDefault();
           return;
         }
         if (ev.key === prefix) {
           ev.preventDefault();
           insert(prefix);
           return;
         }

         const g = keymap[ev.key];
         if (g) {
           ev.preventDefault();
           insert(g);
           return;
         }
         insert(prefix);
         return;
       }

       if (ev.key == prefix
           && !ev.ctrlKey
           && !ev.metaKey
           && !ev.altKey) {
         ev.preventDefault();
         pending = true;
         source.classList.add("pending");
       }

       if (ev.key === "Enter" && ev.ctrlKey) {
         ev.preventDefault();
         run();
       }
     });
     const container = $("glyphs");

     glyphs.forEach(g => {
       const a = document.createElement('a');
       a.textContent = g;
       a.href = '#';
       a.title = g;

       a.onmousedown = ev => ev.preventDefault();

       a.onclick = ev => {
         ev.preventDefault();
         insert(g);
         source.focus();
       };

       container.append(a);
     });

     let worker = new Worker("worker.js");

     function restart_worker() {
       worker.terminate();
       worker = new Worker("worker.js");
     }

     function run_program(text) {
       return new Promise((resolve) => {
         const timer = setTimeout(() => {
           restart_worker();
           resolve({ ok: false, text: "timed out" });
         }, MAX_TIME_MS)

         worker.onmessage = ({ data }) => {
           clearTimeout(timer);
           if (data.crashed) restart_worker();
           resolve(data);
         };

         worker.postMessage({ source: text, max_steps: MAX_INTERPRETER_STEPS });
       });
     }

     async function run() {
       if (run_button.disabled) return;

       run_button.disabled = true;
       status.textContent = "Running";

       const { ok, text } = await run_program(source.value);

       result.textContent = text;
       result.className = ok ? "" : "err";
       status.textContent = ok ? "OK" : "Error";

       run_button.disabled = false;
     }

     run_button.onclick = run;
     run_button.disabled = false;
     status.textContent = "Ready";
    </script>
  </body>
</html>
