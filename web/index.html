<!DOCTYPE html>
<html lang="en" >
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>sable</title>
    <style>
     @font-face {
       font-family: "FairfaxHD";
       src: url("FairfaxHD.ttf") format("truetype");
       font-weight: 400;
       font-style: normal;
     }
     :root {
       --bg: #eeeeee;
       --fg: #111111;
       --pad: #ffffff;
       --border: #cccccc;
       --accent: #2222ff;
       --err: #ff2222;
      }
     * { box-sizing: border-box; }
     body {
       margin: 0;
       background: var(--bg);
       color: var(--fg);
       font-family: sans-serif;
     }
     main {
       max-width: 720px;
       margin: 0 auto;
       padding: 2rem;
     }
     h1 {
       margin: 0 0 .25rem;
     }
     textarea, pre {
       width: 100%;
       margin: 0;
       padding: 0.5rem;
       border: 1px solid var(--border);
       background: var(--pad);
       color: var(--fg);
       font-family: "FairfaxHD", monospace;
       font-size: 18px;
     }
     textarea {
       min-height: 10rem;
       resize: vertical;
     }
     textarea:focus {
       outline: none;
       border: 1px solid var(--accent);
     }
     pre {
       min-height: 5rem;
       white-space: pre-wrap;
       overflow-x: auto;
     }
     pre.err {
       color: var(--err);
     }
     button {
       padding: .4rem .8rem;
       border: 1px solid var(--border);
       background: var(--accent);
       color: var(--pad);
     }
     button:hover {
       background: var(--pad);
       color: var(--accent);
     }
     .bar {
       display: flex;
       gap: .5rem;
       align-items: center;
       margin: .75rem 0;
       flex-wrap: wrap;
     }
    </style>
  </head>
  <body>
    <main>
      <h1>sable</h1>

      <textarea id="src" spellcheck="false" autofocus></textarea>

      <div class="bar" >
        <button id="run" disabled >Run</button>
        <span id="status" >Loading</span>
      </div>

      <pre id="result" ></pre>
    </main>

    <script>
     const MAX_INTERPRETER_STEPS = 4294967295;
     const MAX_TIME_MS = 10000;

     const source = document.getElementById("src");
     const result = document.getElementById("result");
     const run_button = document.getElementById("run");
     const status = document.getElementById("status");

     let worker = new Worker("worker.js");

     function restart_worker() {
       worker.terminate();
       worker = new Worker("worker.js");
     }

     function run_program(text) {
       return new Promise((resolve) => {
         const timer = setTimeout(() => {
           restart_worker();
           resolve({ ok: false, text: "timed out" });
         }, MAX_TIME_MS)

         worker.onmessage = ({ data }) => {
           clearTimeout(timer);
           if (data.crashed) restart_worker();
           resolve(data);
         };

         worker.postMessage({ source: text, max_steps: MAX_INTERPRETER_STEPS });
       });
     }

     async function run() {
       if (run_button.disabled) return;

       run_button.disabled = true;
       status.textContent = "Running";

       const { ok, text } = await run_program(source.value);

       result.textContent = text;
       result.className = ok ? "" : "err";
       status.textContent = ok ? "OK" : "Error";

       run_button.disabled = false;
     }

     run_button.onclick = run;
     run_button.disabled = false;
     status.textContent = "Ready";
    </script>
  </body>
</html>
